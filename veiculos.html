<body data-page="veiculos">
<main>
<section class="bloco"><h1 class="h1">Veículos</h1><p class="intro">Ligeiros, comerciais e pesados. Filtra, compara e fala connosco.</p>
<div class="barra-filtros"><p id="contador" class="contador" aria-live="polite"></p><button type="button" class="botao sec sm" id="abrir-filtros" aria-expanded="false" aria-controls="filtros">Filtros</button></div>
<form id="filtros" class="painel-filtros" aria-label="Filtros de veículos" novalidate>
  <label>Pesquisar <input id="q" type="search" placeholder="Marca ou modelo"></label>
  <label>Tipo <select id="tipo"></select></label>
  <label>Combustível <select id="comb"></select></label>
  <label>Caixa <select id="caixa"></select></label>
  <label>Preço mínimo (€) <input id="pmin" type="number" min="0" inputmode="numeric"></label>
  <label>Preço máximo (€) <input id="pmax" type="number" min="0" inputmode="numeric"></label>
  <label>Ano mínimo <input id="amin" type="number" min="1950" inputmode="numeric"></label>
  <label>Ano máximo <input id="amax" type="number" min="1950" inputmode="numeric"></label>
  <label>Quilómetros até <input id="kmax" type="number" min="0" inputmode="numeric"></label>
  <label>Ordenar <select id="ordem"><option value="">Mais recentes</option><option value="asc">Preço: menor</option><option value="desc">Preço: maior</option><option value="ano">Ano: mais novo</option><option value="km">Menos quilómetros</option></select></label>
  <label class="check"><input id="disp" type="checkbox"> Só disponíveis</label>
  <label class="check"><input id="dest" type="checkbox"> Só destaques</label>
  <label class="check"><input id="favs" type="checkbox"> Só favoritos</label>
  <button type="button" class="botao sec sm" id="limpar">Limpar filtros</button>
</form>
<div class="grade" id="lista"></div></section>
</main>
<script src="js/dados.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
