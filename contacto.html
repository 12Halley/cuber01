<body data-page="contacto">
<main>
<section class="bloco"><h1 class="h1">Contacto</h1>
<div class="coluna-contacto"><address id="morada"></address>
<form id="form-contacto" novalidate>
  <label>Área <select name="empresa"><option>Automóveis</option><option>Construções</option></select></label>
  <label>Nome <input name="nome" autocomplete="name" aria-describedby="e-nome" required><small class="erro-campo" id="e-nome" role="alert"></small></label>
  <label>Email <input name="email" type="email" autocomplete="email" aria-describedby="e-email"><small class="erro-campo" id="e-email" role="alert"></small></label>
  <label>Telefone <input name="telefone" type="tel" autocomplete="tel" aria-describedby="e-telefone"><small class="erro-campo" id="e-telefone" role="alert"></small></label>
  <label>Assunto <input name="assunto" placeholder="Ex.: interesse num veículo ou pedido de orçamento"></label>
  <label>Mensagem <textarea name="mensagem" rows="5" aria-describedby="e-mensagem" required></textarea><small class="erro-campo" id="e-mensagem" role="alert"></small></label>
  <p class="nota">O site não envia mensagens sozinho: abre o WhatsApp ou o teu email com a mensagem pronta para enviares.</p>
  <button class="botao" type="submit" value="wa">Enviar por WhatsApp</button>
  <button class="botao sec" type="submit" value="email">Enviar por email</button>
</form></div></section>
